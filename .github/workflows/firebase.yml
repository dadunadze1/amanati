name: Deploy Firebase

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/firebase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AMANATEBI123_43963 }}
      FIREBASE_PROJECT_ID: amanatebi123-43963
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check && npm run check:functions

      - name: Skip without Firebase credentials
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON == '' }}
        run: echo "FIREBASE_SERVICE_ACCOUNT_AMANATEBI123_43963 is not configured; skipping Firebase deploy."

      - name: Configure Firebase credentials
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy functions and rules
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        run: npx firebase-tools deploy --only functions,firestore:rules --project "$FIREBASE_PROJECT_ID"
